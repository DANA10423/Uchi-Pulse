[package]
name = "uchi-pulse-settings"
version = "0.1.0"
edition = "2024"
publish = false
description = "Uchi-Pulse Hub SQLite settings desktop application"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rfd = "0.15.4"

[dev-dependencies]
uchi-pulse-hub = { path = "../uchi-pulse-hub" }
tempfile = "3.27"
